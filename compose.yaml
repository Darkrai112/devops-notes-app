
services:
  web:
    build: .
    container_name: notes-api
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://notesuser:notespassword@db:5432/notesdb
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: notes-database
    environment:
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: notespassword
      POSTGRES_DB: notesdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesuser -d notesdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
